<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Записатись на прийом</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg:       #1a1a2e;
      --card:     #16213e;
      --accent:   #0f3460;
      --green:    #2ecc71;
      --red:      #e74c3c;
      --yellow:   #f39c12;
      --text:     #e0e0e0;
      --muted:    #888;
      --radius:   12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--tg-theme-bg-color, var(--bg));
      color: var(--tg-theme-text-color, var(--text));
      min-height: 100vh;
      padding: 16px;
    }

    h2 { text-align: center; font-size: 18px; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 20px; }

    .steps { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
    .step {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      background: var(--card); border: 2px solid var(--accent); color: var(--muted);
      transition: all .2s;
    }
    .step.active { background: var(--green); border-color: var(--green); color: #fff; }
    .step.done   { background: var(--accent); border-color: var(--accent); color: #fff; }

    .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .month-nav button {
      background: none; border: 1px solid var(--accent); color: var(--text);
      border-radius: 8px; padding: 6px 14px; font-size: 18px; cursor: pointer; transition: background .15s;
    }
    .month-nav button:hover { background: var(--accent); }
    .month-nav button:disabled { opacity: .3; cursor: default; }
    .month-label { font-size: 16px; font-weight: 600; }

    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
    .cal-header { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 0; font-weight: 600; }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 500; cursor: pointer;
      border: 2px solid transparent; transition: all .15s; position: relative;
    }
    .cal-day.empty   { background: none; cursor: default; }
    .cal-day.past    { background: var(--card); color: var(--muted); cursor: default; opacity: .4; }
    .cal-day.loading { background: var(--card); color: var(--muted); cursor: default; }
    .cal-day.free    { background: rgba(46,204,113,.18); border-color: var(--green); color: var(--green); }
    .cal-day.free:hover { background: rgba(46,204,113,.35); }
    .cal-day.full    { background: rgba(231,76,60,.15); border-color: var(--red); color: var(--red); cursor: not-allowed; }
    .cal-day.selected { background: var(--green) !important; color: #fff !important; border-color: var(--green) !important; }
    .cal-day .dot {
      position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .7;
    }

    .section-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .slot {
      padding: 10px 4px; border-radius: var(--radius); text-align: center;
      font-size: 14px; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: all .15s;
    }
    .slot.free  { background: rgba(46,204,113,.18); border-color: var(--green); color: var(--green); }
    .slot.free:hover { background: rgba(46,204,113,.35); }
    .slot.taken { background: rgba(231,76,60,.12); border-color: var(--red); color: var(--red); cursor: not-allowed; opacity: .7; }
    .slot.selected { background: var(--green) !important; color: #fff !important; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: var(--radius);
      border: 1.5px solid var(--accent); background: var(--card); color: var(--text);
      font-size: 15px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: var(--green); }
    input::placeholder { color: var(--muted); }

    .summary {
      background: var(--card); border-radius: var(--radius); padding: 14px;
      margin-bottom: 16px; font-size: 14px; line-height: 1.8; border-left: 3px solid var(--green);
    }
    .summary strong { color: var(--green); }

    .btn { width: 100%; padding: 14px; border-radius: var(--radius); border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .1s; }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1.5px solid var(--accent); margin-top: 8px; }

    .success-screen { text-align: center; padding: 40px 20px; }
    .success-icon { font-size: 64px; margin-bottom: 16px; }
    .success-screen h2 { font-size: 22px; margin-bottom: 8px; color: var(--green); }
    .success-screen p  { color: var(--muted); font-size: 14px; line-height: 1.6; }

    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
    .error-msg {
      background: rgba(231,76,60,.15); border: 1px solid var(--red);
      border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--red); margin-bottom: 12px;
    }
  </style>
</head>
<body>

<h2>💆 Час для себе</h2>
<p class="subtitle">Запис на масаж</p>

<div class="steps">
  <div class="step active" id="s1">1</div>
  <div class="step" id="s2">2</div>
  <div class="step" id="s3">3</div>
</div>

<div id="step-date">
  <div class="month-nav">
    <button id="prev-month">◀</button>
    <span class="month-label" id="month-label"></span>
    <button id="next-month">▶</button>
  </div>
  <div class="calendar" id="calendar"></div>
</div>

<div id="step-time" class="hidden">
  <div class="section-title" id="time-date-label"></div>
  <div class="slots" id="slots"></div>
  <button class="btn btn-secondary" id="back-to-date">← Обрати інший день</button>
</div>

<div id="step-form" class="hidden">
  <div class="summary" id="booking-summary"></div>
  <div class="error-msg hidden" id="form-error"></div>
  <div class="form-group">
    <label>Ваше ім'я *</label>
    <input type="text" id="inp-name" placeholder="Ім'я та прізвище" autocomplete="name" />
  </div>
  <div class="form-group">
    <label>Телефон (необов'язково)</label>
    <input type="tel" id="inp-phone" placeholder="+380..." autocomplete="tel" />
  </div>
  <button class="btn btn-primary" id="btn-confirm">Підтвердити запис</button>
  <button class="btn btn-secondary" id="back-to-time">← Обрати інший час</button>
</div>

<div id="step-success" class="hidden success-screen">
  <div class="success-icon">✅</div>
  <h2>Запис підтверджено!</h2>
  <p id="success-text"></p>
  <br/>
  <button class="btn btn-secondary" id="btn-close">Закрити</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#1a1a2e'); }

const userId = tg?.initDataUnsafe?.user?.id || null;

const MONTHS_UA = ['Січень','Лютий','Березень','Квітень','Травень','Червень',
                   'Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const DAYS_UA   = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];

let state = { year: new Date().getFullYear(), month: new Date().getMonth(), date: null, hour: null, cache: {} };

function pad(n) { return String(n).padStart(2,'0'); }
function toDateStr(y,m,d) { return `${pad(d)}.${pad(m+1)}.${y}`; }
function monthKey(y,m) { return `${y}-${pad(m+1)}`; }

async function fetchMonth(y,m) {
  const key = monthKey(y,m);
  if (state.cache[key]) return state.cache[key];
  const res  = await fetch(`/api/schedule?month=${key}`);
  const data = await res.json();
  state.cache[key] = data.dates || {};
  return state.cache[key];
}

function showStep(n) {
  ['step-date','step-time','step-form','step-success'].forEach((id,i) => {
    document.getElementById(id).classList.toggle('hidden', i !== n-1);
  });
  [1,2,3].forEach(i => {
    const el = document.getElementById(`s${i}`);
    el.className = 'step' + (i < n ? ' done' : i === n ? ' active' : '');
  });
}

async function renderCalendar() {
  const { year, month } = state;
  document.getElementById('month-label').textContent = `${MONTHS_UA[month]} ${year}`;
  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(year, month, 1).getDay();
  const daysIn   = new Date(year, month+1, 0).getDate();
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'].forEach(d => {
    const h = document.createElement('div'); h.className = 'cal-header'; h.textContent = d; cal.appendChild(h);
  });
  for (let i = 0; i < firstDay; i++) {
    const e = document.createElement('div'); e.className = 'cal-day empty'; cal.appendChild(e);
  }
  const cells = [];
  for (let d = 1; d <= daysIn; d++) {
    const cell = document.createElement('div');
    const date = new Date(year, month, d);
    const dateStr = toDateStr(year, month, d);
    const isPast = date < today;
    cell.className = isPast ? 'cal-day past' : 'cal-day loading';
    cell.textContent = d;
    if (!isPast) { const dot = document.createElement('div'); dot.className = 'dot'; cell.appendChild(dot); }
    cell.dataset.date = dateStr;
    cal.appendChild(cell);
    cells.push({ cell, dateStr, isPast });
  }
  try {
    const dates = await fetchMonth(year, month);
    cells.forEach(({ cell, dateStr, isPast }) => {
      if (isPast) return;
      const info = dates[dateStr];
      if (!info) { cell.className = 'cal-day past'; return; }
      const hasFree = info.slots.some(s => s.free);
      cell.className = 'cal-day ' + (hasFree ? 'free' : 'full');
      if (!hasFree) cell.querySelector('.dot')?.remove();
      if (hasFree) cell.addEventListener('click', () => selectDate(dateStr, info.slots));
    });
  } catch(e) {
    cells.forEach(({ cell, isPast }) => { if (!isPast) cell.className = 'cal-day free'; });
  }
  const now = new Date();
  document.getElementById('prev-month').disabled =
    year < now.getFullYear() || (year === now.getFullYear() && month <= now.getMonth());
  document.getElementById('next-month').disabled =
    year > 2027 || (year === 2027 && month >= 11);
}

function selectDate(dateStr, slots) { state.date = dateStr; renderTimeSlots(dateStr, slots); showStep(2); }

function renderTimeSlots(dateStr, slots) {
  const parts = dateStr.split('.');
  const jsDate = new Date(Number(parts[2]), Number(parts[1])-1, Number(parts[0]));
  document.getElementById('time-date-label').textContent = `${DAYS_UA[jsDate.getDay()]}, ${dateStr}`;
  const container = document.getElementById('slots');
  container.innerHTML = '';
  slots.forEach(({ hour, free }) => {
    const btn = document.createElement('div');
    btn.className = 'slot ' + (free ? 'free' : 'taken');
    btn.textContent = `${hour}:00`;
    if (free) btn.addEventListener('click', () => selectHour(hour));
    container.appendChild(btn);
  });
}

function selectHour(hour) {
  state.hour = hour;
  document.getElementById('booking-summary').innerHTML =
    `<strong>📅 Дата:</strong> ${state.date}<br><strong>🕐 Час:</strong> ${hour}:00`;
  const tgUser = tg?.initDataUnsafe?.user;
  if (tgUser && !document.getElementById('inp-name').value) {
    document.getElementById('inp-name').value = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ');
  }
  showStep(3);
}

document.getElementById('btn-confirm').addEventListener('click', async () => {
  const name  = document.getElementById('inp-name').value.trim();
  const phone = document.getElementById('inp-phone').value.trim();
  const errEl = document.getElementById('form-error');
  errEl.classList.add('hidden');
  if (!name) { errEl.textContent = "Будь ласка, введіть ваше ім'я"; errEl.classList.remove('hidden'); return; }
  const btn = document.getElementById('btn-confirm');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Записуємо...';
  try {
    const res = await fetch('/api/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: state.date, hour: state.hour, name, phone, userId }),
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById('success-text').innerHTML =
        `📅 ${state.date} о ${state.hour}:00<br>👤 ${name}` +
        (phone ? `<br>📞 ${phone}` : '') + `<br><br>Підтвердження надіслано у Telegram 💬`;
      showStep(4);
      delete state.cache[monthKey(state.year, state.month)];
    } else if (data.error === 'taken') {
      errEl.textContent = '😔 Цей час вже зайнятий. Поверніться і оберіть інший.';
      errEl.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Підтвердити запис';
    } else { throw new Error(data.error || 'unknown'); }
  } catch(e) {
    errEl.textContent = '⚠️ Помилка: ' + e.message;
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Підтвердити запис';
  }
});

document.getElementById('prev-month').addEventListener('click', () => {
  if (state.month === 0) { state.year--; state.month = 11; } else state.month--;
  renderCalendar();
});
document.getElementById('next-month').addEventListener('click', () => {
  if (state.month === 11) { state.year++; state.month = 0; } else state.month++;
  renderCalendar();
});
document.getElementById('back-to-date').addEventListener('click', () => { state.date = null; showStep(1); });
document.getElementById('back-to-time').addEventListener('click', async () => {
  const dates = await fetchMonth(state.year, state.month);
  const info = dates[state.date];
  if (info) renderTimeSlots(state.date, info.slots);
  showStep(2);
});
document.getElementById('btn-close').addEventListener('click', () => { if (tg) tg.close(); else window.close(); });

showStep(1);
renderCalendar();
</script>
</body>
</html>
